[package]
name = "blinkora-postgres-to-sqlite"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "json"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "process", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
