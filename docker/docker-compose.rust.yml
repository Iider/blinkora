name: blinkora-rust

networks:
  blinkora-rust-net:
    driver: bridge

services:
  web:
    image: blinkora-rust-web:latest
    container_name: blinkora-rust-web
    build:
      context: ..
      dockerfile: docker/dockerfile.rust
    environment:
      NODE_ENV: production
      PORT: 6676
      PUBLIC_PATH: /app/public
      DATA_DIR: /app/.blinkora
      MIGRATIONS_DIR: /app/prisma/migrations
      NEXTAUTH_URL: http://localhost:6676
      NEXT_PUBLIC_BASE_URL: http://localhost:6676
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in root .env before deployment}
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - 6676:6676
    volumes:
      - ./data/blinkora-rust:/app/.blinkora
      - ./data/backup-rust:/app/backup
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:6676/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - blinkora-rust-net

  db:
    image: postgres:14
    container_name: blinkora-rust-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - 127.0.0.1:55433:5432
    volumes:
      - ./data/postgres-rust:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - blinkora-rust-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: blinkora-rust-minio
    profiles:
      - s3-smoke
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: blinkora
      MINIO_ROOT_PASSWORD: blinkora-rust-s3-secret
    ports:
      - 127.0.0.1:59000:9000
      - 127.0.0.1:59001:9001
    volumes:
      - ./data/minio-rust:/data
    networks:
      - blinkora-rust-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: blinkora-rust-minio-init
    profiles:
      - s3-smoke
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 blinkora blinkora-rust-s3-secret; do sleep 2; done
        mc mb --ignore-existing local/blinkora-rust-smoke
    networks:
      - blinkora-rust-net
