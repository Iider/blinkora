name: blinkora

services:
  web:
    image: blinkora-web:latest
    container_name: blinkora-web
    build:
      context: .
      dockerfile: dockerfile.rust
    environment:
      NODE_ENV: production
      BIND_ADDR: 0.0.0.0
      PORT: 6676
      DATA_DIR: /app/.blinkora
      BLINKORA_SECRET: ${BLINKORA_SECRET:-blinkora-local-default-secret-change-me}
    restart: unless-stopped
    ports:
      - 6676:6676
    volumes:
      - ./data/blinkora:/app/.blinkora
      - ./data/backup:/app/backup
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:6676/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
